# Rebuilds and restarts the site container on the self-hosted runner after
# the CI workflow has passed on main.
name: Deploy to home server

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: self-hosted
    concurrency:
      group: deploy-home-server
      cancel-in-progress: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Rebuild and restart the container
        run: |
          set -euo pipefail

          WORKDIR=/home/deploy/personalwebsite/dev

          rm -rf "$WORKDIR"
          mkdir -p "$WORKDIR"
          cp -r "$GITHUB_WORKSPACE"/. "$WORKDIR"/

          cd "$WORKDIR"
          docker compose down || true
          docker compose up -d --build
          docker image prune -f

  smoke-test:
    name: Production smoke tests
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Wait for the site to come back
        run: sleep 30
      - name: Run the Production smoke folder with newman
        run: npm run test:api -- --folder "Production smoke"
